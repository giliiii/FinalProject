<div class="login-page">
  <!-- כפתור חזרה לדף הבית -->
  <button class="btn-home" (click)="router.navigate(['/'])">בית</button>
<div class="gift-page user-home">
<div class="card">

    <!-- SEARCH AND FILTER SECTION -->
    <div class="button-container">
    </div>

    <!-- Search by gift name -->
    <div class="flex flex-col">
        <label for="giftName" class="block mb-2 font-semibold text-sm">חיפוש לפי שם מתנה</label>
        <span class="p-input-icon-right w-full">
            <i class="pi pi-search"></i>
            <input id="giftName" type="text" pInputText [(ngModel)]="searchByGiftName" (input)="onGiftNameChange()"
                placeholder="הקלד שם מתנה..." class="w-full" />
        </span>
    </div>

    <!-- Clear filters button -->
    <div class="flex justify-center">
        <button pButton type="button" label="נקה סינונים" icon="pi pi-times" (click)="clearFilters()"
            severity="secondary" [text]="true">
        </button>
    </div>

    <div class="flex justify-center mt-4">
        <button class="btn-gold-outline" pButton label="צפה בסל הקניות" icon="pi pi-shopping-cart" severity="info"
            (click)="openBasketDialog()"></button>
    </div>

    <!-- פתיחת חלון צד ימין -->
    <p-drawer [(visible)]="basketDrawerVisible" position="right" [modal]="true" [closable]="false">
        <div *ngIf="baskets.length === 0">
            <p>אין פריטים בסל קניות.</p>
        </div>
        <div *ngIf="baskets.length > 0">
            <ul>
                <li *ngFor="let basket of baskets">
                    <div class="flex justify-between">
                        <span>{{ basket.giftName }} - {{ formatCost(basket.cost) }}</span>
                        <button pButton icon="pi pi-trash" class="p-button-danger"
                            (click)="removeFromBasket(basket.id)"></button>
                    </div>
                </li>
            </ul>
            <div class="flex justify-between mt-4">
                <button pButton label="לשלם" icon="pi pi-credit-card" (click)="openPaymentDialog()"></button>
            </div>
        </div>
        <!-- דיאלוג תשלום בתוך סל הקניות -->
        <p-dialog header="תשלום" [(visible)]="paymentDialogVisible" [modal]="true" [closable]="true"
            [style]="{width: '300px', height: '500px'}"
            contentStyle="display: flex; flex-direction: row; justify-content: flex-start; padding: 1rem;">

            <div class="flex flex-col gap-4 h-full">
                <!-- מספר כרטיס -->
                <div class="flex flex-col w-full">
                    <label for="cardNumber" class="block mb-1 font-semibold">מספר כרטיס אשראי</label>
                    <input id="cardNumber" type="text" pInputText [(ngModel)]="creditCardNumber"
                        placeholder="1234 5678 9012 3456" class="w-full" />
                </div>
                <br>
                <!-- CVV -->
                <div class="flex flex-col w-full">
                    <label for="cvv" class="block mb-1 font-semibold">CVV</label>
                    <input id="cvv" type="text" pInputText [(ngModel)]="creditCardCVV" placeholder="123"
                        class="w-full" />
                </div>
                <br>
                <!-- תוקף -->
                <div class="flex flex-col w-full">
                    <label for="expiry" class="block mb-1 font-semibold">תוקף (MM/YY)</label>
                    <input id="expiry" type="text" pInputText [(ngModel)]="creditCardExpiry" placeholder="01/25"
                        class="w-full" />
                </div>
                <br>
                <!-- כפתור אישור -->
                <div class="flex justify-center mt-auto w-full">
                    <button pButton label="שלם" icon="pi pi-check" severity="success" (click)="confirmPayment()"
                        class="w-full"></button>
                </div>
            </div>
        </p-dialog>

    </p-drawer>


    <p-dataview [value]="filteredGifts" [layout]="layout">

        <ng-template #grid let-items>
            <div class="grid grid-cols-12 gap-4 p-3">
                <div *ngFor="let item of items" class="col-span-12 sm:col-span-6 lg:col-span-4">
                    <div class="p-4 border rounded shadow-1 flex flex-col text-right card-fixed-height">
                        <div class="image-container-grid">
                            <img class="fixed-img mb-4" [src]="item.picture || 'assets/no-image.png'" [alt]="item.name"/>
                        </div>

                        <div class="content-container">
                            <div class="text-lg font-bold truncate">{{ item.name }}</div>
                            <div class="text-sm text-surface-500 mb-2">קטגוריה: {{ item.categoryId }}</div>
                        </div>

                        <div class="mt-auto">
                            <div class="text-xl font-semibold text-primary mb-3">{{ formatCost(item.cost) }}</div>
                            <div class="grid grid-cols-2 gap-2">
                                <button pButton label="הוסף לסל" icon="pi pi-shopping-cart" (click)="addToBasket(item)" class="btn-gold-outline p-button-sm w-full"></button>
