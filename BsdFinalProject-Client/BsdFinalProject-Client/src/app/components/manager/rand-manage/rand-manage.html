<div class="container">

   <!-- כפתור למחיקת כל הזוכים -->
    <div class="button-container">
    <button pButton type="button" label="מחק את כל הזוכים" icon="pi pi-trash" (click)="deleteAllWinners()" class="p-button-success"></button>
    </div>

   <p-table [value]="gifts">
     <ng-template pTemplate="header">
       <tr>
         <th>שם המתנה</th>
         <th>מספר רוכשים</th>
         <th>הגרל זוכה</th>
         <th>הזוכה</th>
       </tr>
     </ng-template>

     <ng-template pTemplate="body" let-gift>
       <tr>
         <td>{{ gift.name }}</td>
         <td>{{ buyersCount(gift) }}</td>
         <td>
           <button *ngIf="gift.winnerName==' '" pButton type="button" label="הגרל זוכה" icon="pi pi-gift" (click)="drawWinner(gift)" class="p-button-info"> </button>
         </td>
         <td *ngIf="gift.winnerName">הזוכה הוא: {{ gift.winnerName }}</td>
       </tr>
     </ng-template>
   </p-table>
  
  <p-dialog header="מזכה!" [(visible)]="displayWinnerDialog" modal="true" [closable]="true" (onHide)="closeWinnerDialog()">
    <div *ngIf="winnerUser">
      <h3>מתנה: {{ winnerGiftName }}</h3>
      <p><strong>שם מלא:</strong> {{ winnerUser.fullName }}</p>
      <p><strong>אימייל:</strong> {{ winnerUser.eMail }}</p>
      <p *ngIf="winnerUser.phone"><strong>טלפון:</strong> {{ winnerUser.phone }}</p>
      <p *ngIf="winnerUser.address"><strong>כתובת:</strong> {{ winnerUser.address }}</p>
    </div>
    <div *ngIf="!winnerUser">
      <p>הזוכה: {{ winnerGiftName }}</p>
    </div>
    <p-footer>
      <button pButton type="button" label="סגור" (click)="closeWinnerDialog()"></button>
    </p-footer>
  </p-dialog>
 </div>
