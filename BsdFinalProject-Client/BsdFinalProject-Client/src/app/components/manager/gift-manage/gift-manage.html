<div class="gift-page">
<p-toast />

<p-panel class="sticky-filter-panel" header="חיפוש וסינון מתנות" [toggleable]="true" [collapsed]="true" class="mb-4">
    <ng-template #header>
        <div class="w-full text-center font-bold text-xl"></div>
    </ng-template>
    <div class="grid grid-rows-1 lg:grid-rows-3 gap-4 items-end">
        <div class="flex-col">
            <label for="giftName">חיפוש לפי שם מתנה</label>
            <span class="p-input-icon-right">
                <i class="pi pi-search"></i>
                <input pInputText id="giftName" [(ngModel)]="searchByGiftName" (input)="onGiftNameChange()" placeholder="הקלד שם מתנה..." />
            </span>
        </div>

        <div class="flex-col">
            <label for="donorSelect">סינון לפי תורם</label>
            <p-select id="donorSelect" [(ngModel)]="selectedDonor" [options]="donors" optionLabel="name" [showClear]="true" placeholder="בחר תורם..." (onChange)="onDonorChange()"></p-select>
        </div>

        <div class="flex-col clear-filters-btn">
            <button pButton type="button" label="נקה סינונים" icon="pi pi-times" (click)="clearFilters()" [text]="true" class="btn-gold-outline"></button>
        </div>
    </div>
</p-panel>

<!-- דיאלוג עדכון מתנה -->
<p-dialog [(visible)]="displayDialog" header="עדכון מתנה" [modal]="true" [style]="{width: '400px'}">
    <div class="form-group">
        <label for="newGiftName">שם המתנה:</label>
        <input pInputText id="newGiftName" [(ngModel)]="newGiftName" type="text" placeholder="הכנס שם" class="form-input"/>
    </div>

    <div class="form-group">
        <label for="newGiftDescription">תיאור:</label>
        <input pInputText id="newGiftDescription" [(ngModel)]="newGiftDescription" type="text" placeholder="הכנס תיאור" class="form-input"/>
    </div>

    <div class="form-group">
        <label for="newGiftCost">מחיר:</label>
        <input pInputText id="newGiftCost" [(ngModel)]="newGiftCost" type="number" placeholder="הכנס מחיר" class="form-input"/>
    </div>

    <div class="form-group">
        <label for="newGiftPicture">תמונה:</label>
        <input pInputText id="newGiftPicture" [(ngModel)]="newGiftPicture" type="text" placeholder="הכנס נתיב לתמונה" class="form-input"/>
    </div>

    <div class="form-group">
        <label for="newGiftCategoryId">קטגוריה:</label>
        <p-select 
            id="newGiftCategoryId"
            [(ngModel)]="selectedCategory" 
            [options]="categoryOptions " 
            optionLabel="label" 
            optionValue="value"
            placeholder="בחר קטגוריה"
            appendTo="body"
            class="w-full">
        </p-select>
    </div>

    <ng-template pTemplate="footer">
        <button pButton type="button" label="ביטול" (click)="closeDialog2()" class="btn-gold-outline"></button>
        <button pButton type="button" label="שמור" (click)="updateGiftDetails()" class="btn-gold-outline"></button>
    </ng-template>
</p-dialog>

<!-- דיאלוג הוספת מתנה חדשה -->
<p-dialog [(visible)]="displayDialog2" header="הוסף מתנה חדש" [modal]="true" [style]="{width: '400px'}">
    <div class="form-group">
        <label for="giftName">שם המתנה:</label>
        <input pInputText id="giftName" [(ngModel)]="newGiftname" type="text" placeholder="הכנס שם" class="form-input"/>
    </div>

    <div class="form-group">
        <label for="giftDescription">תיאור:</label>
        <input pInputText id="giftDescription" [(ngModel)]="newGiftdescription" type="text" placeholder="הכנס תיאור" class="form-input"/>
    </div>

    <div class="form-group">
        <label for="giftCost">עלות:</label>
        <input pInputText id="giftCost" [(ngModel)]="newGiftcost" type="number" placeholder="הכנס עלות" class="form-input"/>
    </div>

    <div class="form-group">
        <label for="giftDonor">תורם:</label>
        <p-select 
            id="giftDonor"
            [(ngModel)]="newGiftdonorId" 
            [options]="donors" 
            optionLabel="name"
            placeholder="בחר תורם..."
            styleClass="w-full"
            appendTo="body">
        </p-select>
    </div>

    <div class="form-group">
        <label for="giftCategory">קטגוריה:</label>
        <p-select 
            id="giftCategory"
            [(ngModel)]="newGiftcategoryId" 
            [options]="categories" 
            optionLabel="name"
            placeholder="בחר קטגוריה..."
            styleClass="w-full"
            appendTo="body">
        </p-select>
    </div>

    <div class="form-group">
        <label for="giftPicture">תמונה (URL):</label>
        <input pInputText id="giftPicture" [(ngModel)]="newGiftpicture" type="text" placeholder="הכנס URL לתמונה" class="form-input"/>
        <p-fileupload name="giftImage" [customUpload]="true" (onSelect)="onSelectFiles($event)" [auto]="true" [showUploadButton]="false" [showCancelButton]="false" accept="image/*">
            <ng-template #file let-file>
                <div class="flex flex-col items-center gap-2">
                    <img *ngIf="newGiftPicture" [src]="newGiftPicture" width="150" height="120"/>
                    <button pButton label="בחר תמונה" icon="pi pi-images" (click)="choosePicture(file)" class="btn-gold-outline"></button>
                </div>
            </ng-template>
        </p-fileupload>
    </div>

    <ng-template pTemplate="footer">
        <button pButton type="button" label="ביטול" (click)="closeDialog2()" class="btn-gold-outline"></button>
        <button pButton type="button" label="שמור" (click)="addNewGift()" class="btn-gold-outline"></button>
    </ng-template>
</p-dialog>

<!-- כפתור פתיחת דיאלוג -->
<div class="button-container">
    <button pButton type="button" label="הוסף מתנה חדשה" icon="pi pi-plus" (click)="showAddGiftDialog()" class="btn-gold-outline"></button>
</div>
