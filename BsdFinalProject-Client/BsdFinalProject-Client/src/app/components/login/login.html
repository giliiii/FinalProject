<div class="card flex flex-wrap justify-center items-end gap-4">
    <p-floatlabel>
        <input pInputText [(ngModel)]="email" id="email" name="email" type="text" />
        <label for="email">email</label>
    </p-floatlabel>
    <p-floatlabel>
        <input pInputText [(ngModel)]="password" id="password" name="password" type="password" />
        <label for="password">password</label>
    </p-floatlabel>
    <button (click)="login()">אישור</button>
</div>
